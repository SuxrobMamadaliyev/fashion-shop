<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Buyurtmalarim — AURA</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/pages.css">
</head>
<body>

<header class="topbar">
  <button class="btn-icon" onclick="history.back()" id="back-btn"></button>
  <span class="topbar-title">Buyurtmalarim</span>
  <div style="width:44px"></div>
</header>

<main class="view" id="orders-list">
  <div class="skeleton" style="height:120px;margin:16px"></div>
</main>

<script src="/js/icons.js"></script>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script>
const statusLabels = { NEW: 'Yangi', CONFIRMED: 'Tasdiqlangan', PROCESSING: 'Jarayonda', SHIPPING: 'Yetkazilmoqda', DELIVERED: 'Yetkazildi', CANCELLED: 'Bekor qilindi' };

async function loadOrders() {
  initTelegram();
  document.getElementById('back-btn').innerHTML = icon('arrowLeft', 20);
  await Promise.all([bootstrapAuth(), loadPublicSettings()]);

  const list = document.getElementById('orders-list');
  try {
    const { orders } = await api.getMyOrders();
    if (orders.length === 0) {
      list.innerHTML = `<div class="empty-state">${icon('package',56)}<h3>Buyurtmalar yo'q</h3><p>Hali hech qanday buyurtma bermadingiz</p><a class="btn btn-primary mt-24" href="catalog.html">Xarid qilish</a></div>`;
      return;
    }
    list.innerHTML = `<div class="mt-16">${orders.map(renderOrderCard).join('')}</div>`;
  } catch (e) {
    list.innerHTML = `<div class="empty-state">${icon('package',56)}<h3>Xatolik</h3><p>${e.message}</p></div>`;
  }
}

function renderOrderCard(o) {
  const date = new Date(o.createdAt).toLocaleDateString('uz-UZ', { day: 'numeric', month: 'long', year: 'numeric' });
  const itemsPreview = o.products.map((p) => `${p.name} x${p.quantity}`).join(', ');
  return `
    <div class="order-card">
      <div class="order-card-top">
        <span class="order-number">#${o.orderNumber}</span>
        <span class="order-status-badge status-${o.status}">${statusLabels[o.status] || o.status}</span>
      </div>
      <div class="text-secondary" style="font-size:13px;margin-bottom:8px">${itemsPreview}</div>
      <div class="row between">
        <span class="text-tertiary" style="font-size:12px">${date}</span>
        <span style="font-weight:800">${formatPrice(o.total)}</span>
      </div>
    </div>
  `;
}

loadOrders();
</script>
</body>
</html>
