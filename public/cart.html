<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Savatcha — AURA</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/pages.css">
</head>
<body>

<header class="topbar">
  <span class="topbar-title">Savatcha</span>
</header>

<main class="view" id="cart-content">
  <div class="skeleton" style="height:110px;margin:16px"></div>
  <div class="skeleton" style="height:110px;margin:16px"></div>
</main>

<nav class="navbar" id="navbar"></nav>

<script src="/js/icons.js"></script>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script>
let cartData = null;

async function loadCart() {
  await initPage('cart');
  await renderCart();
}

async function renderCart() {
  const content = document.getElementById('cart-content');
  try {
    const { cart } = await api.getCart();
    cartData = cart;

    if (!cart.items || cart.items.length === 0) {
      content.innerHTML = `<div class="empty-state">${icon('cart',56)}<h3>Savatcha bo'sh</h3><p>Hali hech narsa qo'shmadingiz</p><a class="btn btn-primary mt-24" href="catalog.html">Katalogga o'tish</a></div>`;
      return;
    }

    let itemsHtml = '';
    let subtotal = 0;

    for (const item of cart.items) {
      const product = item.product;
      if (!product) continue;
      const lineTotal = product.price * item.quantity;
      subtotal += lineTotal;
      itemsHtml += `
        <div class="cart-item" data-item-id="${item._id}">
          <div class="cart-item-img"><img src="${(product.images && product.images[0]) || '/images/placeholder.png'}" alt="${product.name}"></div>
          <div class="cart-item-body">
            <div class="cart-item-name">${product.name}</div>
            <div class="cart-item-meta">${[item.size, item.color].filter(Boolean).join(' · ') || '\u00A0'}</div>
            <div class="cart-item-footer">
              <div class="qty-stepper">
                <button data-action="dec" data-item="${item._id}">${icon('minus',14)}</button>
                <span>${item.quantity}</span>
                <button data-action="inc" data-item="${item._id}">${icon('plus',14)}</button>
              </div>
              <button class="btn-icon" data-action="remove" data-item="${item._id}" style="width:34px;height:34px">${icon('trash',16)}</button>
            </div>
          </div>
        </div>
      `;
    }

    const deliveryFee = (AppState.settings && AppState.settings.deliveryPrice) || 25000;
    const total = subtotal + deliveryFee;

    content.innerHTML = `
      <div class="mt-16">${itemsHtml}</div>
      <div class="cart-summary">
        <div class="summary-row"><span>Mahsulotlar</span><span>${formatPrice(subtotal)}</span></div>
        <div class="summary-row"><span>Yetkazib berish</span><span>${formatPrice(deliveryFee)}</span></div>
        <div class="summary-row total"><span>Jami</span><span>${formatPrice(total)}</span></div>
        <button class="btn btn-accent btn-block mt-24" onclick="location.href='checkout.html'">Buyurtma berish</button>
      </div>
    `;

    wireCartEvents();
  } catch (e) {
    content.innerHTML = `<div class="empty-state">${icon('cart',56)}<h3>Xatolik</h3><p>${e.message}</p></div>`;
  }
}

function wireCartEvents() {
  document.querySelectorAll('[data-action="inc"]').forEach((btn) => {
    btn.addEventListener('click', () => changeQty(btn.getAttribute('data-item'), 1));
  });
  document.querySelectorAll('[data-action="dec"]').forEach((btn) => {
    btn.addEventListener('click', () => changeQty(btn.getAttribute('data-item'), -1));
  });
  document.querySelectorAll('[data-action="remove"]').forEach((btn) => {
    btn.addEventListener('click', () => removeItem(btn.getAttribute('data-item')));
  });
}

async function changeQty(itemId, delta) {
  const item = cartData.items.find((i) => i._id === itemId);
  if (!item) return;
  const newQty = item.quantity + delta;
  try {
    await api.updateCartItem(itemId, newQty);
    await renderCart();
    refreshCartBadge();
  } catch (e) { showToast(e.message); }
}

async function removeItem(itemId) {
  const el = document.querySelector(`.cart-item[data-item-id="${itemId}"]`);
  if (el) el.classList.add('removing');
  try {
    await api.removeCartItem(itemId);
    setTimeout(async () => { await renderCart(); refreshCartBadge(); }, 220);
  } catch (e) { showToast(e.message); }
}

loadCart();
</script>
</body>
</html>
