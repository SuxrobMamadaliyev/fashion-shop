<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>AURA — Premium Fashion</title>
<link rel="icon" href="/images/favicon.png">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/pages.css">
</head>
<body>

<header class="topbar">
  <span class="topbar-title" id="brand-title">AURA</span>
  <div class="row gap-8">
    <a class="btn-icon" href="favorites.html" id="fav-icon-link" aria-label="Sevimlilar"></a>
  </div>
</header>

<main class="view">
  <section class="hero" id="hero">
    <div class="skeleton" style="width:100%;height:100%"></div>
  </section>

  <div class="chip-row" id="category-chips"></div>

  <div class="section-header">
    <span class="section-title">Yangi kolleksiya</span>
    <a class="see-all" href="catalog.html?filter=new">Barchasi</a>
  </div>
  <div class="hscroll" id="new-products"><div class="skeleton" style="width:150px;height:220px"></div></div>

  <div class="section-header">
    <span class="section-title">Ko'p sotilganlar</span>
    <a class="see-all" href="catalog.html?filter=bestseller">Barchasi</a>
  </div>
  <div class="hscroll" id="bestseller-products"><div class="skeleton" style="width:150px;height:220px"></div></div>

  <div class="section-header">
    <span class="section-title">Chegirmada</span>
    <a class="see-all" href="catalog.html?filter=sale">Barchasi</a>
  </div>
  <div class="hscroll" id="sale-products"><div class="skeleton" style="width:150px;height:220px"></div></div>
</main>

<nav class="navbar" id="navbar"></nav>

<script src="/js/icons.js"></script>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/product-card.js"></script>
<script>
async function loadHome() {
  await initPage('home');
  document.getElementById('fav-icon-link').innerHTML = icon('heart', 22);

  try {
    const { categories } = await api.getCategories();
    const chipRow = document.getElementById('category-chips');
    chipRow.innerHTML = categories
      .map((c) => `<a class="chip" href="catalog.html?category=${c._id}">${c.name}</a>`)
      .join('');
  } catch (e) {}

  const heroEl = document.getElementById('hero');
  try {
    const { products } = await api.getProducts({ isNew: 'true', limit: 1 });
    const heroProduct = products[0];
    if (heroProduct) {
      heroEl.innerHTML = `
        <img src="${heroProduct.images[0] || ''}" alt="${heroProduct.name}">
        <div class="hero-overlay">
          <div class="hero-eyebrow">New Collection</div>
          <div class="hero-title">${heroProduct.name}</div>
          <a class="btn btn-accent" href="product.html?id=${heroProduct._id}">Explore Collection</a>
        </div>`;
    } else {
      heroEl.innerHTML = `
        <div class="hero-overlay" style="background:linear-gradient(135deg, var(--accent), #1c1c1e)">
          <div class="hero-eyebrow">New Collection</div>
          <div class="hero-title">Premium Style, Redefined</div>
          <a class="btn btn-accent" href="catalog.html">Explore Collection</a>
        </div>`;
    }
  } catch (e) {
    heroEl.innerHTML = '';
  }

  loadSection('new-products', { isNew: 'true', limit: 8 });
  loadSection('bestseller-products', { isBestSeller: 'true', limit: 8 });
  loadSection('sale-products', { isSale: 'true', limit: 8 });
}

async function loadSection(containerId, params) {
  const container = document.getElementById(containerId);
  try {
    const { products } = await api.getProducts(params);
    if (products.length === 0) {
      container.innerHTML = `<p class="text-secondary" style="padding:8px 4px">Mahsulotlar topilmadi</p>`;
      return;
    }
    container.innerHTML = products.map(renderProductCard).join('');
    bindProductCardEvents(container);
  } catch (e) {
    container.innerHTML = '';
  }
}

loadHome();
</script>
</body>
</html>
