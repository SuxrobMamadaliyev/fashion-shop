<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<title>Sevimlilar — AURA</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="stylesheet" href="/css/variables.css">
<link rel="stylesheet" href="/css/base.css">
<link rel="stylesheet" href="/css/components.css">
<link rel="stylesheet" href="/css/pages.css">
</head>
<body>

<header class="topbar">
  <span class="topbar-title">Sevimlilar</span>
</header>

<main class="view">
  <div class="product-grid" id="fav-grid">
    <div class="skeleton" style="height:260px"></div>
    <div class="skeleton" style="height:260px"></div>
  </div>
</main>

<nav class="navbar" id="navbar"></nav>

<script src="/js/icons.js"></script>
<script src="/js/api.js"></script>
<script src="/js/app.js"></script>
<script src="/js/product-card.js"></script>
<script>
async function loadFavorites() {
  await initPage('favorites');
  const grid = document.getElementById('fav-grid');
  try {
    const { favorites } = await api.getFavorites();
    favoritesCache.clear();
    favorites.forEach((f) => favoritesCache.add(String(f.product._id)));
    favoritesCacheLoaded = true;

    if (favorites.length === 0) {
      grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">${icon('heart',56)}<h3>Sevimlilar bo'sh</h3><p>Yoqtirgan mahsulotlaringizni shu yerga qo'shing</p></div>`;
      return;
    }

    grid.innerHTML = favorites.map((f) => renderProductCard(f.product)).join('');
    bindProductCardEvents(grid);
  } catch (e) {
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">${icon('heart',56)}<h3>Xatolik</h3><p>${e.message}</p></div>`;
  }
}
loadFavorites();
</script>
</body>
</html>
